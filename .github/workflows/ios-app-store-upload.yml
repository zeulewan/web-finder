name: iOS App Store Upload

on:
  workflow_dispatch:

concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and Upload
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_STORE_CONNECT_KEY_CONTENT}" ]]; then
            echo "Missing APP_STORE_CONNECT_KEY_CONTENT secret" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/app-store-connect"
          printf '%s' "$APP_STORE_CONNECT_KEY_CONTENT" > "$RUNNER_TEMP/app-store-connect/AuthKey.p8"

      - name: Archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/app-store-connect/AuthKey.p8
        run: |
          set -euo pipefail
          AUTH_ARGS=(
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          )
          xcodebuild archive \
            -project ios/WebFinder.xcodeproj \
            -scheme WebFinder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/appstore/WebFinder.xcarchive \
            -allowProvisioningUpdates \
            "${AUTH_ARGS[@]}"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/app-store-connect/AuthKey.p8
        run: |
          set -euo pipefail
          AUTH_ARGS=(
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          )
          xcodebuild -exportArchive \
            -archivePath ios/build/appstore/WebFinder.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath ios/build/appstore/export \
            -allowProvisioningUpdates \
            "${AUTH_ARGS[@]}"

      - name: Submit App Store version for review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/app-store-connect/AuthKey.p8
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/WebFinder/Info.plist)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/WebFinder/Info.plist)"
          python3 -m venv "$RUNNER_TEMP/submit-venv"
          source "$RUNNER_TEMP/submit-venv/bin/activate"
          python -m pip install cryptography
          for attempt in 1 2 3 4 5; do
            if python scripts/submit-ios-appstore.py "$VERSION" --build-number "$BUILD" --cancel-active-review --whats-new "Refreshes are more reliable on slow tailnet paths, credentials move to Keychain, and publisher URLs now offer discovery without Tailscale API credentials."; then
              exit 0
            fi
            echo "Submit attempt $attempt failed; waiting for App Store Connect build processing..."
            sleep 60
          done
          python scripts/submit-ios-appstore.py "$VERSION" --build-number "$BUILD" --cancel-active-review --whats-new "Refreshes are more reliable on slow tailnet paths, credentials move to Keychain, and publisher URLs now offer discovery without Tailscale API credentials."
