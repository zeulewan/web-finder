<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zensical Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div class="header">
      <span class="title">Zensical Scanner</span>
      <button class="btn-icon" id="refresh" title="Refresh">&#8635;</button>
    </div>

    <div class="content">
      <div class="section">
        <div class="section-label">Local</div>
        <div id="local-list"></div>
      </div>

      <div class="section">
        <div class="section-label">Tailscale</div>
        <div id="tailscale-list"></div>
      </div>
    </div>

    <div class="footer">
      <button class="quit-btn" id="quit">Quit</button>
      <span class="timestamp" id="timestamp"></span>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
